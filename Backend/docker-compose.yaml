services:
  postgresdb:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: ${DB_USERNAME:-avnadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - ecom-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-avnadmin} -d defaultdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/defaultdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-avnadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_HOST: postgresdb
      DB_PORT: 5432
      DB_NAME: defaultdb
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ADMIN_RESET_KEY: ${ADMIN_RESET_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - ecom-network
    volumes:
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 512M

networks:
  ecom-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local